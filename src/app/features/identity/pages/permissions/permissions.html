<div class="permissions-page">

  <div class="page-header">
    <div>
      <h1>Permissions</h1>
      <p>View available permissions across the campus portal.</p>
    </div>
  </div>

  @if (errorMessage) {
    <div class="error-message">
      <div>
        <strong>Unable to load permissions</strong>
        <p>{{ errorMessage }}</p>
      </div>

      <button
        type="button"
        class="retry-button"
        (click)="retry()"
      >
        Retry
      </button>
    </div>
  }

  <app-permission-table
    [permissions]="permissions"
    [isLoading]="isLoading"
  />

</div>
