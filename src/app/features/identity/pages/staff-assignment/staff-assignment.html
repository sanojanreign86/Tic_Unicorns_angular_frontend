<div class="staff-assignment-page">

  <div class="page-header">
    <div>
      <h1>Staff Assignment</h1>
      <p>
        Assign staff members to a department, hostel, or canteen.
      </p>
    </div>

    <button
      type="button"
      class="primary-button"
      (click)="openForm()"
    >
      + Assign Staff
    </button>
  </div>

  @if (successMessage) {
    <div class="success-message">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
  }

  @if (showForm) {
    <div class="form-overlay">
      <div class="form-modal">
        <app-staff-assignment-form
          [isLoading]="isSaving"
          (formSubmit)="assignStaff($event)"
          (cancel)="closeForm()"
        />
      </div>
    </div>
  }

</div>
